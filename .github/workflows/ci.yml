name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m py_compile src/hardware/system.py src/hardware/asus.py src/hardware/capabilities.py src/config.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify packaging scripts parse
        run: bash -n packaging/build-packages.sh
