name: Build release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install package builders
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
      - name: Set release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "${GITHUB_REF_NAME#v}" > VERSION
          fi
      - name: Build RPM and DEB packages
        run: ./packaging/build-packages.sh
      - name: Validate package metadata
        run: |
          dpkg-deb --info dist/*.deb
          rpm -qip dist/*.rpm
      - name: Upload package artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: armoury-crate-packages
          path: dist/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
